name: Prepare goya stock inputs

on:
  workflow_dispatch:
    inputs:
      dump_url:
        description: HTTPS URL of the goya dump (.tar, .tar.gz or .zip)
        required: true
        type: string
      dump_sha256:
        description: Expected SHA-256 of the dump (optional)
        required: false
        default: ''
        type: string
      platform_only:
        description: Import vendor_boot only, without touch/KeyMint blobs
        required: true
        default: false
        type: boolean
      commit:
        description: Commit prebuilt/, proprietary/ and manifests/ to this repository
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: goya-prepare-stock-${{ github.ref }}
  cancel-in-progress: false

env:
  ORANGEFOX_BRANCH: '14.1'

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out device tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Install host packages
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            coreutils cpio curl file findutils git lz4 python3 rsync tar unzip
          sudo apt-get clean

      - name: Download dump
        shell: bash
        env:
          DUMP_URL: ${{ inputs.dump_url }}
          DUMP_SHA256: ${{ inputs.dump_sha256 }}
        run: |
          set -euo pipefail

          case "$DUMP_URL" in
            https://*) ;;
            *)
              echo "::error::dump_url must be an https:// URL" >&2
              exit 1
              ;;
          esac

          dump="$RUNNER_TEMP/goya-dump-download"
          curl --fail --location --retry 5 --retry-all-errors \
            --proto '=https' --tlsv1.2 \
            "$DUMP_URL" --output "$dump"
          test -s "$dump"

          if [ -n "$DUMP_SHA256" ]; then
            printf '%s  %s\n' "$DUMP_SHA256" "$dump" | sha256sum --check --strict
          else
            echo "::warning::No dump_sha256 supplied; only the archive structure is validated."
          fi

          magic="$(od -An -tx1 -N4 "$dump" | tr -d ' \n')"
          case "$magic" in
            1f8b*) dump_file="$RUNNER_TEMP/goya-dump.tar.gz" ;;
            504b0304) dump_file="$RUNNER_TEMP/goya-dump.zip" ;;
            *) dump_file="$RUNNER_TEMP/goya-dump.tar" ;;
          esac
          mv -f "$dump" "$dump_file"
          echo "dump_file=$dump_file" >> "$GITHUB_ENV"
          echo "archive size: $(stat -c %s "$dump_file") bytes"

          # Sanity-check the archive before touching the device tree.
          case "$dump_file" in
            *.tar.gz) tar -tzf "$dump_file" >/dev/null ;;
            *.zip) unzip -l "$dump_file" >/dev/null ;;
            *) tar -tf "$dump_file" >/dev/null ;;
          esac

      - name: Import dump
        shell: bash
        env:
          PLATFORM_ONLY: ${{ inputs.platform_only }}
        run: |
          set -euo pipefail
          args=()
          if [ "$PLATFORM_ONLY" = "true" ]; then
            args+=(--platform-only)
          fi
          tools/import-dump.sh "$dump_file" ${args[@]+"${args[@]}"}

      - name: Verify imported inputs
        shell: bash
        env:
          PLATFORM_ONLY: ${{ inputs.platform_only }}
        run: |
          set -euo pipefail
          if [ "$PLATFORM_ONLY" = "true" ]; then
            tools/verify-build-inputs.sh
          else
            tools/verify-build-inputs.sh --require-blobs
          fi

      - name: Show imported files
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          find prebuilt/vendor-boot prebuilt/modules proprietary -maxdepth 3 -type f \
            -printf '%10s  %p\n' 2>/dev/null | sort -k2 || true

      - name: Commit imported inputs
        id: commit
        shell: bash
        env:
          COMMIT_INPUTS: ${{ inputs.commit }}
        run: |
          set -euo pipefail

          if [ "$COMMIT_INPUTS" != "true" ]; then
            rm -rf "$RUNNER_TEMP/goya-imported-inputs"
            mkdir -p "$RUNNER_TEMP/goya-imported-inputs"
            rsync -a prebuilt proprietary manifests \
              "$RUNNER_TEMP/goya-imported-inputs/"
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "goya input importer"
          git config user.email "goya-ci@localhost"
          git add -A prebuilt proprietary manifests
          if git diff --cached --quiet; then
            echo "No input changes to commit"
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "Import stock goya inputs from phone dump"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Upload imported inputs without committing
        if: ${{ inputs.commit == false }}
        uses: actions/upload-artifact@v4
        with:
          name: goya-imported-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/goya-imported-inputs
          if-no-files-found: error
          retention-days: 14

      - name: Trigger build workflow
        if: ${{ inputs.commit == true && steps.commit.outcome == 'success' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRE_BLOBS: ${{ inputs.platform_only == false }}
        run: |
          set -euo pipefail
          # Boolean inputs must use -F so gh sends JSON booleans instead of
          # the strings "true"/"false", which GitHub rejects for type: boolean.
          gh workflow run build-orangefox.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            -F publish=true \
            -F require_blobs="$REQUIRE_BLOBS"

      - name: Write summary
        if: always()
        shell: bash
        run: |
          {
            echo "## goya stock input import"
            echo
            echo "- Dump: \`${{ inputs.dump_url }}\`"
            echo "- Platform only: \`${{ inputs.platform_only }}\`"
            echo "- Committed: \`${{ steps.commit.outputs.committed || 'false' }}\`"
            echo
            echo "If the commit was pushed, the build workflow was dispatched explicitly."
            echo "A protected main branch may reject the push; use an unprotected branch or a pull request."
          } >> "$GITHUB_STEP_SUMMARY"
