name: Build OrangeFox goya

on:
  # Build only on explicit dispatch. The prepare workflow pushes the imported
  # stock inputs and then dispatches this workflow itself; a push trigger would
  # start a second, input-less build that fails on missing blobs and cancels
  # the dispatched one through the concurrency group.
  workflow_dispatch:
    inputs:
      publish:
        description: Create a prerelease with the vendor_boot images
        required: true
        default: true
        type: boolean
      require_blobs:
        description: Fail when touch/KeyMint blobs are missing (Stage 2 release)
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: orangefox-goya-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ORANGEFOX_BRANCH: '14.1'
  ORANGEFOX_SYNC_REVISION: '11e4406b2bd1de939a26b6bfbad7e371cc3b1fa7'
  ORANGEFOX_TOP: ${{ github.workspace }}/OrangeFox
  OF_BUILD_JOBS: '1'
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: '3G'
  CCACHE_CACHE_VERSION: '1'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out device tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: device-tree

      - name: Set build metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          fingerprint=""
          if [ -f device-tree/prebuilt/firmware-info.txt ]; then
            fingerprint="$(sed -n 's/^ro\.build\.fingerprint=//p' \
              device-tree/prebuilt/firmware-info.txt | head -n 1)"
          fi
          if [ -z "$fingerprint" ]; then
            fingerprint="unknown firmware; see prebuilt/firmware-info.txt"
          fi

          echo "artifact_name=orangefox-goya-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "image_name=OrangeFox-R14.1-Unofficial-goya-system-compatible.img" >> "$GITHUB_OUTPUT"
          echo "disable_avb_image_name=OrangeFox-R14.1-Unofficial-goya-disable-avb-system-compatible.img" >> "$GITHUB_OUTPUT"
          printf 'firmware_fingerprint=%s\n' "$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Remove stale build worktree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ORANGEFOX_TOP" \
            /mnt/goya-orangefox \
            "$GITHUB_WORKSPACE/goya-out" \
            "$GITHUB_WORKSPACE/ofox-sync" \
            "$GITHUB_WORKSPACE/pinned-manifest" \
            "$GITHUB_WORKSPACE/artifacts"
          rm -f "$GITHUB_WORKSPACE/ci-gitconfig" \
            "$GITHUB_WORKSPACE/orangefox-build.log"

      - name: Free disk space
        uses: rokibhasansagar/slimhub_actions@c2a6e4317d3de2b623ac7395b05e9d2149e8289b

      - name: Select build filesystem
        shell: bash
        run: |
          set -euo pipefail

          build_root="$GITHUB_WORKSPACE/OrangeFox"
          out_root="$build_root/out"
          layout="single"

          rm -rf "$build_root" /mnt/goya-orangefox "$GITHUB_WORKSPACE/goya-out"

          # Public ubuntu-24.04 runners come in two layouts: a single large
          # root disk, or a small root disk plus a separate /mnt disk.
          # Repository sync peaks at about 80 GiB of new data, so a small /mnt
          # cannot hold it either. Only use /mnt when it is a distinct
          # filesystem with real headroom; otherwise stay on the root disk.
          if mountpoint -q /mnt && \
             [[ "$(stat -c %d /mnt)" != "$(stat -c %d "$GITHUB_WORKSPACE")" ]]; then
            mnt_available_kib="$(df -Pk /mnt | awk 'NR == 2 { print $4 }')"
            if [[ -n "${mnt_available_kib}" && \
                  "${mnt_available_kib}" -ge $((100 * 1024 * 1024)) ]]; then
              sudo mkdir -p /mnt/goya-orangefox
              sudo chown "$(id -u):$(id -g)" /mnt/goya-orangefox
              ln -s /mnt/goya-orangefox "$build_root"
              mkdir -p "$GITHUB_WORKSPACE/goya-out"
              ln -s "$GITHUB_WORKSPACE/goya-out" "$out_root"
              layout="split"
              echo "Source tree on /mnt (separate disk), out/ on the root disk"
            fi
          fi

          if [[ "$layout" = "single" ]]; then
            mkdir -p "$build_root" "$out_root"
            echo "Single-disk runner: source tree and out/ on the root disk"
          fi

          source_real="$(realpath "$build_root")"
          out_real="$(realpath "$out_root")"
          {
            echo "GOYA_BUILD_LAYOUT=$layout"
            echo "GOYA_SOURCE_ROOT=$source_real"
            echo "GOYA_OUT_ROOT=$out_real"
          } >> "$GITHUB_ENV"

          nproc
          df -h "$source_real" "$out_real"
          df -i "$source_real" "$out_real"

      - name: Install host packages
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl device-tree-compiler flex \
            g++-multilib gcc-multilib git gnupg gperf imagemagick \
            lib32ncurses-dev lib32readline-dev lib32z1-dev libelf-dev \
            liblz4-tool libncurses-dev libsdl1.2-dev libssl-dev libxml2 \
            libxml2-utils lz4 openjdk-17-jdk-headless pngcrush \
            python-is-python3 python3 ripgrep rsync schedtool squashfs-tools \
            unzip xsltproc zip zlib1g-dev
          sudo apt-get clean
          java_home="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          test -x "${java_home}/bin/java"
          echo "JAVA_HOME=${java_home}" >> "$GITHUB_ENV"

      - name: Verify stock inputs
        shell: bash
        env:
          REQUIRE_BLOBS: ${{ inputs.require_blobs }}
        run: |
          set -euo pipefail
          cd device-tree
          if [ "$REQUIRE_BLOBS" = "true" ]; then
            tools/verify-build-inputs.sh --require-blobs
          else
            tools/verify-build-inputs.sh
          fi

      - name: Setup build swap
        shell: bash
        run: |
          set -euo pipefail
          MIN_SWAP_GIB=12 \
            bash "$GITHUB_WORKSPACE/device-tree/.github/scripts/setup-swap.sh"

      - name: Check runner capacity
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${GOYA_BUILD_LAYOUT:-}" || -z "${GOYA_SOURCE_ROOT:-}" || \
                -z "${GOYA_OUT_ROOT:-}" ]]; then
            echo "::error::build filesystem selection did not produce usable paths"
            exit 1
          fi

          source_available_kib="$(df -Pk "$GOYA_SOURCE_ROOT" | awk 'NR == 2 { print $4 }')"
          out_available_kib="$(df -Pk "$GOYA_OUT_ROOT" | awk 'NR == 2 { print $4 }')"

          if [[ "$GOYA_BUILD_LAYOUT" = "split" ]]; then
            # The source tree and .repo live on /mnt; .repo is deleted before
            # the build. out/ stays on the root disk.
            source_required_kib=$((100 * 1024 * 1024))
            out_required_kib=$((45 * 1024 * 1024))
          else
            # Measured on a healthy 145 GB runner: 19 GiB baseline after the
            # image cleanup and swap, then 80 GiB of new data at the sync peak
            # (99 GiB used, 46 GiB free). Requiring 115 GiB keeps ~35 GiB of
            # margin for sync retries; deleting .repo before the build frees
            # another 20-30 GiB for out/.
            source_required_kib=$((115 * 1024 * 1024))
            out_required_kib=$((45 * 1024 * 1024))
          fi

          if [[ -z "${source_available_kib}" || \
                "${source_available_kib}" -lt "${source_required_kib}" ]]; then
            echo "::error::OrangeFox goya needs at least $((source_required_kib / 1024 / 1024)) GiB free for the source tree in ${GOYA_SOURCE_ROOT}; found $((source_available_kib / 1024 / 1024)) GiB (layout ${GOYA_BUILD_LAYOUT})."
            exit 1
          fi

          if [[ "$GOYA_BUILD_LAYOUT" = "split" ]]; then
            if [[ -z "${out_available_kib}" || \
                  "${out_available_kib}" -lt "${out_required_kib}" ]]; then
              echo "::error::OrangeFox goya needs at least $((out_required_kib / 1024 / 1024)) GiB free for out/ in ${GOYA_OUT_ROOT}; found $((out_available_kib / 1024 / 1024)) GiB."
              exit 1
            fi
          fi

          memory_kib="$(awk '/^MemTotal:/ { print $2 }' /proc/meminfo)"
          required_memory_kib=$((14 * 1024 * 1024))
          if [[ -z "${memory_kib}" || "${memory_kib}" -lt "${required_memory_kib}" ]]; then
            echo "::error::This workflow needs a 16 GB-class GitHub-hosted runner; found $((memory_kib / 1024 / 1024)) GiB RAM."
            exit 1
          fi

          df -h "$GOYA_SOURCE_ROOT" "$GOYA_OUT_ROOT"
          df -i "$GOYA_SOURCE_ROOT" "$GOYA_OUT_ROOT"
          free -h

      - name: Restore compiler cache
        id: ccache_restore
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: orangefox-goya-ccache-${{ env.CCACHE_CACHE_VERSION }}-${{ runner.os }}-${{ env.ORANGEFOX_SYNC_REVISION }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            orangefox-goya-ccache-${{ env.CCACHE_CACHE_VERSION }}-${{ runner.os }}-${{ env.ORANGEFOX_SYNC_REVISION }}-${{ github.sha }}-
            orangefox-goya-ccache-${{ env.CCACHE_CACHE_VERSION }}-${{ runner.os }}-${{ env.ORANGEFOX_SYNC_REVISION }}-

      - name: Configure compiler cache
        shell: bash
        run: |
          set -euo pipefail
          command -v ccache
          install -d "$CCACHE_DIR"
          ccache -M "$CCACHE_MAXSIZE"
          ccache -z
          ccache -p

      - name: Install repo tool
        shell: bash
        run: |
          set -euo pipefail
          install -d "$HOME/bin"
          curl --fail --location --retry 5 --retry-all-errors \
            https://storage.googleapis.com/git-repo-downloads/repo \
            --output "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Sync OrangeFox sources
        shell: bash
        run: |
          set -euo pipefail

          manifest_repo="$GITHUB_WORKSPACE/pinned-manifest"
          export GIT_CONFIG_GLOBAL="$GITHUB_WORKSPACE/ci-gitconfig"
          mkdir -p "$manifest_repo"
          cp "$GITHUB_WORKSPACE/device-tree/manifests/orangefox-fox_14.1-pinned.xml" \
            "$manifest_repo/default.xml"
          git -C "$manifest_repo" init --initial-branch=main --quiet
          git -C "$manifest_repo" config user.name "OrangeFox CI"
          git -C "$manifest_repo" config user.email "orangefox-ci@localhost"
          git -C "$manifest_repo" add default.xml
          git -C "$manifest_repo" commit --quiet -m "Pinned OrangeFox 14.1 manifest"
          git config --global protocol.file.allow always
          git config --global http.lowSpeedLimit 1
          git config --global http.lowSpeedTime 600

          mkdir -p "$ORANGEFOX_TOP"
          cd "$ORANGEFOX_TOP"
          repo init --depth=1 \
            -u "file://${manifest_repo}" \
            -b main \
            -m default.xml

          (
            while sleep 60; do
              date -u '+%Y-%m-%dT%H:%M:%SZ sync heartbeat'
              df -h "$GOYA_SOURCE_ROOT" "$GOYA_OUT_ROOT"
              free -h
            done
          ) &
          heartbeat_pid=$!
          trap 'kill "$heartbeat_pid" 2>/dev/null || true' EXIT

          sync_succeeded=0
          low_space=0
          for sync_attempt in 1 2 3; do
            repo sync -c -j4 --retry-fetches=3 \
              --no-clone-bundle --no-tags --optimized-fetch &
            sync_pid=$!

            while kill -0 "$sync_pid" 2>/dev/null; do
              avail_kib="$(df -Pk "$GOYA_SOURCE_ROOT" | awk 'NR == 2 { print $4 }')"
              if [[ -n "${avail_kib}" && "${avail_kib}" -lt $((8 * 1024 * 1024)) ]]; then
                echo "::error::Free space on ${GOYA_SOURCE_ROOT} fell below 8 GiB during the source sync; aborting now so the runner can still upload its logs."
                pkill -KILL -P "$sync_pid" 2>/dev/null || true
                kill -KILL "$sync_pid" 2>/dev/null || true
                low_space=1
                break
              fi
              sleep 20
            done

            sync_rc=0
            wait "$sync_pid" 2>/dev/null || sync_rc=$?

            if [[ "$low_space" -eq 1 ]]; then
              break
            fi
            if [[ "$sync_rc" -eq 0 ]]; then
              sync_succeeded=1
              break
            fi
            if [[ "$sync_attempt" -lt 3 ]]; then
              delay_seconds=$((sync_attempt * 20))
              echo "::warning::OrangeFox source sync attempt ${sync_attempt} failed; retrying in ${delay_seconds}s."
              sleep "$delay_seconds"
            fi
          done
          if [[ "$low_space" -eq 1 ]]; then
            echo "::error::OrangeFox source sync stopped because the runner disk is too small for the 80 GiB sync peak. Re-run the workflow to get a 150 GB-class runner." >&2
            exit 1
          fi
          if [[ "$sync_succeeded" -ne 1 ]]; then
            echo "::error::OrangeFox source sync failed after three complete attempts." >&2
            exit 1
          fi

          kill "$heartbeat_pid" 2>/dev/null || true
          trap - EXIT

      - name: Apply OrangeFox vold patch
        shell: bash
        run: |
          set -euo pipefail

          sync_dir="$GITHUB_WORKSPACE/ofox-sync"
          git clone --filter=blob:none https://gitlab.com/OrangeFox/sync.git "$sync_dir"
          git -C "$sync_dir" checkout --detach "$ORANGEFOX_SYNC_REVISION"
          test "$(git -C "$sync_dir" rev-parse HEAD)" = "$ORANGEFOX_SYNC_REVISION"

          vold_patch="$sync_dir/patches/patch-vold-fox_14.1.diff"
          test "$(sha256sum "$vold_patch" | awk '{print $1}')" = \
            "29b4b0b387c3185a3dcc69f141a3c84969510547d13ed2de71eefa8423c57778"
          if git -C "$ORANGEFOX_TOP/system/vold" apply --reverse --check "$vold_patch" 2>/dev/null; then
            echo "OrangeFox system/vold patch is already applied"
          else
            git -C "$ORANGEFOX_TOP/system/vold" apply --check "$vold_patch"
            git -C "$ORANGEFOX_TOP/system/vold" apply "$vold_patch"
          fi

      - name: Install goya device tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ORANGEFOX_TOP/device/xiaomi/goya"
          rsync -a --delete \
            --exclude .git \
            --exclude images \
            --exclude out \
            "$GITHUB_WORKSPACE/device-tree/" \
            "$ORANGEFOX_TOP/device/xiaomi/goya/"

      - name: Apply source patches and verify
        shell: bash
        run: |
          set -euo pipefail
          "$ORANGEFOX_TOP/device/xiaomi/goya/tools/apply-orangefox-patches.sh" \
            "$ORANGEFOX_TOP"

      - name: Drop sync metadata
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ORANGEFOX_TOP/.repo" \
            "$GITHUB_WORKSPACE/ofox-sync" \
            "$GITHUB_WORKSPACE/pinned-manifest" \
            "$GITHUB_WORKSPACE/ci-gitconfig"
          df -h "$GOYA_SOURCE_ROOT" "$GOYA_OUT_ROOT"
          free -h

      - name: Check compilation capacity
        shell: bash
        run: |
          set -euo pipefail

          available_kib="$(df -Pk "$GOYA_OUT_ROOT" | awk 'NR == 2 { print $4 }')"
          required_kib=$((45 * 1024 * 1024))
          if [[ -z "${available_kib}" || "${available_kib}" -lt "${required_kib}" ]]; then
            echo "::error::OrangeFox goya needs at least $((required_kib / 1024 / 1024)) GiB free for out/ in ${GOYA_OUT_ROOT} after .repo cleanup; found $((available_kib / 1024 / 1024)) GiB."
            exit 1
          fi

          du -sh "$GOYA_SOURCE_ROOT"
          df -h "$GOYA_SOURCE_ROOT" "$GOYA_OUT_ROOT"
          df -i "$GOYA_SOURCE_ROOT" "$GOYA_OUT_ROOT"

      - name: Build vendor_boot image
        id: build
        shell: bash
        working-directory: ${{ env.ORANGEFOX_TOP }}
        env:
          ALLOW_MISSING_DEPENDENCIES: 'true'
          FOX_BUILD_DEVICE: goya
          FOX_AB_DEVICE: '1'
          FOX_VIRTUAL_AB_DEVICE: '1'
          OF_LOW_MEMORY_BUILD: '1'
          GOMEMLIMIT: '3GiB'
          GOGC: '20'
          _JAVA_OPTIONS: '-Xmx3g'
          USE_CCACHE: '1'
          CCACHE_EXEC: /usr/bin/ccache
          CCACHE_COMPILERCHECK: content
          CCACHE_COMPRESS: 'true'
        run: |
          set -euo pipefail
          build_jobs="$(nproc)"
          export OF_BUILD_JOBS="$build_jobs"
          export NINJA_ARGS="-j${build_jobs} -l${build_jobs}"
          export SOONG_UI_NINJA_ARGS="$NINJA_ARGS"
          printf 'Using %s Ninja jobs\n' "$build_jobs"

          (
            while sleep 60; do
              date -u '+%Y-%m-%dT%H:%M:%SZ build heartbeat'
              df -h "$GOYA_SOURCE_ROOT" "$GOYA_OUT_ROOT"
              free -h
            done
          ) &
          heartbeat_pid=$!
          trap 'kill "$heartbeat_pid" 2>/dev/null || true' EXIT

          device/xiaomi/goya/build-lowmem.sh vendorbootimage 2>&1 | \
            tee "$GITHUB_WORKSPACE/orangefox-build.log"

          kill "$heartbeat_pid" 2>/dev/null || true
          trap - EXIT

      - name: Check compiler cache
        id: ccache_state
        if: ${{ always() && steps.build.outcome != 'skipped' }}
        shell: bash
        run: |
          set -euo pipefail
          size_kib=0
          if [ -d "$CCACHE_DIR" ]; then
            size_kib="$(du -sk "$CCACHE_DIR" | awk '{print $1}')"
          fi
          if [ "$size_kib" -ge $((100 * 1024)) ]; then
            echo "worth_saving=true" >> "$GITHUB_OUTPUT"
          else
            echo "worth_saving=false" >> "$GITHUB_OUTPUT"
          fi
          echo "ccache size: $((size_kib / 1024)) MiB"

      - name: Save compiler cache
        if: ${{ always() && steps.ccache_state.outputs.worth_saving == 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: orangefox-goya-ccache-${{ env.CCACHE_CACHE_VERSION }}-${{ runner.os }}-${{ env.ORANGEFOX_SYNC_REVISION }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Report compiler cache
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ccache -s || true
          if [ -d "$CCACHE_DIR" ]; then
            du -sh "$CCACHE_DIR"
          fi

      - name: Validate release image
        shell: bash
        env:
          IMAGE_NAME: ${{ steps.metadata.outputs.image_name }}
          DISABLE_AVB_IMAGE_NAME: ${{ steps.metadata.outputs.disable_avb_image_name }}
          REQUIRE_BLOBS: ${{ inputs.require_blobs }}
        run: |
          set -euo pipefail

          product="$ORANGEFOX_TOP/out/target/product/goya"
          device="$ORANGEFOX_TOP/device/xiaomi/goya"
          image="$product/$IMAGE_NAME"
          disable_avb_image="$product/$DISABLE_AVB_IMAGE_NAME"
          avbtool="$ORANGEFOX_TOP/out/host/linux-x86/bin/avbtool"

          test -f "$image"
          test -f "${image}.sha256"
          test -f "$disable_avb_image"
          test -f "${disable_avb_image}.sha256"
          test -x "$avbtool"
          test "$(stat -c %s "$image")" = "117440512"
          test "$(stat -c %s "$disable_avb_image")" = "117440512"
          sha256sum --check --strict "${image}.sha256"
          sha256sum --check --strict "${disable_avb_image}.sha256"
          test -f "$product/vendor_boot.img"
          cmp -s "$image" "$product/vendor_boot.img"

          avb_dir="$(mktemp -d)"
          inspect_dir="$(mktemp -d)"
          inspect_disable_avb_dir="$(mktemp -d)"
          platform_cpio="$(mktemp)"
          recovery_cpio="$(mktemp)"
          recovery_list="$(mktemp)"
          disable_avb_platform_cpio="$(mktemp)"
          trap 'rm -rf "$avb_dir" "$inspect_dir" "$inspect_disable_avb_dir" "$platform_cpio" "$recovery_cpio" "$recovery_list" "$disable_avb_platform_cpio"' EXIT

          ln -s "$image" "$avb_dir/vendor_boot.img"
          "$avbtool" verify_image --image "$avb_dir/vendor_boot.img"
          ln -sfn "$disable_avb_image" "$avb_dir/vendor_boot.img"
          "$avbtool" verify_image --image "$avb_dir/vendor_boot.img"

          python3 "$device/tools/unpack-vendor-boot.py" \
            --input "$image" --out "$inspect_dir" >/dev/null
          python3 "$device/tools/unpack-vendor-boot.py" \
            --input "$disable_avb_image" --out "$inspect_disable_avb_dir" >/dev/null

          entries="$(python3 - "$inspect_dir/header.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              info = json.load(handle)
          if info.get("header_version") != 4:
              raise SystemExit("repacked vendor_boot is not v4")
          if info.get("page_size") != 4096:
              raise SystemExit("repacked vendor_boot page size is not 4096")
          ramdisk_size = info.get("vendor_ramdisk_size", 0)
          if not 0 < ramdisk_size <= 64000000:
              raise SystemExit(
                  f"vendor ramdisk is {ramdisk_size} bytes; limit is 64,000,000")
          print(f"vendor_ramdisk_size={ramdisk_size}", file=sys.stderr)
          platform = next((e for e in info["ramdisk_table"]
                           if e["type_name"] == "platform" and e["size"] > 0), None)
          recovery = next((e for e in info["ramdisk_table"]
                           if e["type_name"] == "recovery" and e["size"] > 0), None)
          if platform is None or recovery is None:
              raise SystemExit("repacked vendor_boot lacks platform or recovery fragment")
          print(platform["file"])
          print(recovery["file"])
          PY
          )"
          platform_file="$(printf '%s\n' "$entries" | sed -n '1p')"
          recovery_file="$(printf '%s\n' "$entries" | sed -n '2p')"

          # Parse the FDT instead of grepping the raw strings: the removed
          # property name may stay in the unused string table or appear as a
          # compatible value of the offload node itself.
          python3 "$device/tools/patch-vendor-boot-dtb.py" \
            --input "$inspect_dir/dtb" --check-absent mediatek,usb-offload

          lz4 -d -f "$inspect_dir/$platform_file" "$platform_cpio" >/dev/null
          for module in \
            panel-o12a-36-02-0a-dsc-vdo.ko \
            mediatek-drm.ko \
            mtk_panel_ext.ko \
            xhci-mtk-hcd-v2.ko \
            mtu3.ko \
            extcon-mtk-usb.ko \
            ufs-mediatek-mod.ko \
            spi-mt65xx.ko \
            i2c-mt65xx.ko \
            mtk_tinysys_ipi.ko \
            mtk_rpmsg_mbox.ko \
            mtk-mbox.ko; do
            cpio -it --quiet < "$platform_cpio" | grep -qx "lib/modules/$module" || {
              echo "::error::platform fragment is missing $module" >&2
              exit 1
            }
          done

          lz4 -d -f "$inspect_dir/$recovery_file" "$recovery_cpio" >/dev/null
          cpio -it --quiet < "$recovery_cpio" > "$recovery_list"
          grep -Eq '^(\./)?system/bin/(recovery|twrp)$' "$recovery_list" || {
            echo "::error::recovery fragment has no recovery executable" >&2
            exit 1
          }

          # The MTP gadget, the ZIP stack and magiskboot must survive the size
          # trimming.
          for path in system/etc/init/hw/init.rc system/bin/zip system/bin/ziptool \
                      system/bin/unzip system/bin/zipinfo sbin/zip \
                      system/bin/magiskboot sbin/magiskboot; do
            grep -qx "$path" "$recovery_list" || {
              echo "::error::recovery fragment is missing $path" >&2
              exit 1
            }
          done
          mkdir -p "$inspect_dir/recovery-root"
          (
            cd "$inspect_dir/recovery-root"
            cpio -idm --quiet --no-absolute-filenames \
              system/etc/init/hw/init.rc < "$recovery_cpio"
          )
          grep -qF -- 'functions/ffs.mtp' \
            "$inspect_dir/recovery-root/system/etc/init/hw/init.rc" || {
            echo "::error::recovery init.rc has no MTP gadget" >&2
            exit 1
          }
          for path in system/bin/gnutar system/bin/gnused \
                      sbin/gnutar sbin/gnused lib/modules/scp.ko; do
            if grep -qx "$path" "$recovery_list"; then
              echo "::error::recovery fragment still contains optional file $path" >&2
              exit 1
            fi
          done

          if [ "$REQUIRE_BLOBS" = "true" ]; then
            for module in xiaomi_touch_goya.ko nt38771_touch_goya.ko si_haptic.ko; do
              grep -qx "lib/modules/$module" "$recovery_list" || {
                echo "::error::recovery fragment is missing $module" >&2
                exit 1
              }
            done
            grep -qx 'system/bin/vendor.xiaomi.hw.touchfeature-service-recovery' "$recovery_list" || {
              echo "::error::recovery fragment has no touch HAL" >&2
              exit 1
            }
            for path in vendor/manifest.xml system/manifest.xml \
                        vendor/lib64/libjc_keymint_transport.nxp.so; do
              grep -qx "$path" "$recovery_list" || {
                echo "::error::recovery fragment is missing $path" >&2
                exit 1
              }
            done
            ta_count="$(grep -cE '(^|/)(vendor|odm)/mitee/ta/.*\.ta$' "$recovery_list" || true)"
            if [ "$ta_count" -ne 2 ]; then
              echo "::error::recovery fragment has $ta_count TEE TAs; expected 2" >&2
              exit 1
            fi
          fi

          grep -qxF 'androidboot.vbmeta.device_state := "unlocked"' \
            "$inspect_disable_avb_dir/bootconfig"
          grep -qxF 'androidboot.verifiedbootstate := "orange"' \
            "$inspect_disable_avb_dir/bootconfig"
          grep -qxF 'androidboot.flash.locked := "0"' \
            "$inspect_disable_avb_dir/bootconfig"

          disable_avb_platform_file="$(python3 - \
            "$inspect_disable_avb_dir/header.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              info = json.load(handle)
          platform = next((e for e in info["ramdisk_table"]
                           if e["type_name"] == "platform" and e["size"] > 0), None)
          if platform is None:
              raise SystemExit("disable-avb image has no platform fragment")
          print(platform["file"])
          PY
          )"
          lz4 -d -f "$inspect_disable_avb_dir/$disable_avb_platform_file" \
            "$disable_avb_platform_cpio" >/dev/null
          mkdir -p "$avb_dir/fstab"
          (
            cd "$avb_dir/fstab"
            cpio -idm --quiet --no-absolute-filenames \
              first_stage_ramdisk/fstab.mt6899 < "$disable_avb_platform_cpio"
          )
          disable_avb_fstab="$avb_dir/fstab/first_stage_ramdisk/fstab.mt6899"
          test -f "$disable_avb_fstab"
          if grep -Eq '(^|,)(avb|avb_keys?=)' "$disable_avb_fstab"; then
            echo "::error::disable-avb platform fstab still contains AVB flags" >&2
            exit 1
          fi

      - name: Collect release artifact
        shell: bash
        env:
          IMAGE_NAME: ${{ steps.metadata.outputs.image_name }}
          DISABLE_AVB_IMAGE_NAME: ${{ steps.metadata.outputs.disable_avb_image_name }}
          FIRMWARE_FINGERPRINT: ${{ steps.metadata.outputs.firmware_fingerprint }}
          REQUIRE_BLOBS: ${{ inputs.require_blobs }}
        run: |
          set -euo pipefail
          product="$ORANGEFOX_TOP/out/target/product/goya"
          image="$product/$IMAGE_NAME"
          disable_avb_image="$product/$DISABLE_AVB_IMAGE_NAME"

          rm -rf "$GITHUB_WORKSPACE/artifacts"
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp -fp "$image" "$GITHUB_WORKSPACE/artifacts/$IMAGE_NAME"
          cp -fp "$disable_avb_image" "$GITHUB_WORKSPACE/artifacts/$DISABLE_AVB_IMAGE_NAME"
          (
            cd "$GITHUB_WORKSPACE/artifacts"
            sha256sum "$IMAGE_NAME" > "${IMAGE_NAME}.sha256"
            sha256sum "$DISABLE_AVB_IMAGE_NAME" > "${DISABLE_AVB_IMAGE_NAME}.sha256"
          )

          cat > "$GITHUB_WORKSPACE/artifacts/build-info.md" <<EOF
          Automated OrangeFox 14.1 build for Xiaomi 15T (goya).

          - Device-tree commit: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}
          - OrangeFox branch: ${ORANGEFOX_BRANCH}
          - Firmware: ${FIRMWARE_FINGERPRINT}
          - GitHub run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Require blobs: ${REQUIRE_BLOBS:-false}
          - Magisk addon: v30.7 APK embedded in the vendor_boot partition tail and copied to /FFiles/OF_Magisk/Magisk.zip at boot

          Flash only the standard image first. Keep the stock vendor_boot for rollback.
          EOF

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: artifacts
          if-no-files-found: error
          retention-days: 30

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orangefox-goya-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            orangefox-build.log
            OrangeFox/out/logs
          if-no-files-found: warn
          retention-days: 14

      - name: Clean build worktree
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ORANGEFOX_TOP" \
            /mnt/goya-orangefox \
            "$GITHUB_WORKSPACE/goya-out" \
            "$GITHUB_WORKSPACE/ofox-sync" \
            "$GITHUB_WORKSPACE/pinned-manifest" \
            "$GITHUB_WORKSPACE/artifacts"
          rm -f "$GITHUB_WORKSPACE/ci-gitconfig" \
            "$GITHUB_WORKSPACE/orangefox-build.log"

  release:
    # The OrangeFox tree may live on a dedicated branch instead of main.
    # workflow_dispatch already requires write access, so publishing from the
    # branch the build was started on is safe and keeps the release usable.
    if: ${{ needs.build.result == 'success' && inputs.publish }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          # Match the artifact name exactly. A wildcard such as
          # `orangefox-goya-release-*-<run>-<attempt>` needs an extra literal
          # hyphen and therefore never matches the uploaded name.
          pattern: orangefox-goya-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-artifacts
          merge-multiple: true

      - name: Verify images
        shell: bash
        run: |
          set -euo pipefail
          cd release-artifacts
          for image in \
            OrangeFox-R14.1-Unofficial-goya-system-compatible.img \
            OrangeFox-R14.1-Unofficial-goya-disable-avb-system-compatible.img
          do
            test -f "${image}"
            test -f "${image}.sha256"
            sha256sum --check --strict "${image}.sha256"
          done

      - name: Create prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          release_tag="goya-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA::7}"
          notes="$GITHUB_WORKSPACE/release-notes.md"
          cat > "$notes" <<EOF
          Automated OrangeFox 14.1 build for Xiaomi 15T (goya).

          - Device-tree commit: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}
          - OrangeFox branch: ${ORANGEFOX_BRANCH}
          - GitHub run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Magisk addon: v30.7 APK embedded in the vendor_boot partition tail and copied to /FFiles/OF_Magisk/Magisk.zip at boot

          Keep the stock vendor_boot image. Flash the standard image first; use the
          disable-avb variant only when Android rejects AVB state or logical-partition
          verification.
          EOF

          gh release create "$release_tag" \
            "release-artifacts/OrangeFox-R14.1-Unofficial-goya-system-compatible.img" \
            "release-artifacts/OrangeFox-R14.1-Unofficial-goya-system-compatible.img.sha256" \
            "release-artifacts/OrangeFox-R14.1-Unofficial-goya-disable-avb-system-compatible.img" \
            "release-artifacts/OrangeFox-R14.1-Unofficial-goya-disable-avb-system-compatible.img.sha256" \
            "release-artifacts/build-info.md" \
            --repo "$GH_REPO" \
            --target "$GITHUB_SHA" \
            --title "OrangeFox goya CI ${GITHUB_SHA::7}" \
            --notes-file "$notes" \
            --prerelease
